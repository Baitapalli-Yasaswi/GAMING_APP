<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }
        input {
            padding: 10px;
            width: 80%;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #5a67d8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background-color: #4c51bf;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Guess The Number</h2>
        <p>I'm thinking of a number between 1 and 100.</p>
        
        <input type="number" id="userGuess" placeholder="Enter your guess">
        <br>
        <button id="guessBtn">Guess</button>
        <!-- Feature 2: Play Again Button (Hidden by default) -->
        <button id="restartBtn" class="hidden" style="background-color: #38a169;">Play Again</button>
        
        <p id="message"></p>
        <!-- Feature 1: Attempts Counter Display -->
        <p id="attemptsText" style="font-size: 14px; color: #666;"></p>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0; // Feature 1: Track attempts

        const guessBtn = document.getElementById('guessBtn');
        const restartBtn = document.getElementById('restartBtn');
        const userGuess = document.getElementById('userGuess');
        const message = document.getElementById('message');
        const attemptsText = document.getElementById('attemptsText');

        guessBtn.addEventListener('click', function() {
            let guess = Number(userGuess.value);

            if (!guess || guess < 1 || guess > 100) {
                message.textContent = "Please enter a number between 1 and 100!";
                message.style.color = "red";
                return;
            }

            attempts++; // Count this guess

            if (guess === randomNumber) {
                // Feature 1: Show attempts on success
                message.textContent = `🎉 Correct! You guessed it in ${attempts} attempts!`;
                message.style.color = "green";
                
                // Feature 2: Show restart button, hide guess button
                guessBtn.classList.add('hidden');
                restartBtn.classList.remove('hidden');
                userGuess.disabled = true;
            } else if (guess > randomNumber) {
                message.textContent = "📉 Too high! Try a lower number.";
                message.style.color = "#d97706";
                attemptsText.textContent = `Attempts so far: ${attempts}`;
            } else {
                message.textContent = "📈 Too low! Try a higher number.";
                message.style.color = "#2563eb";
                attemptsText.textContent = `Attempts so far: ${attempts}`;
            }
            
            userGuess.value = ''; // Clear input field for next guess
        });

        // Feature 2: Reset game logic when Play Again is clicked
        restartBtn.addEventListener('click', function() {
            randomNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            message.textContent = '';
            attemptsText.textContent = '';
            userGuess.value = '';
            userGuess.disabled = false;
            
            restartBtn.classList.add('hidden');
            guessBtn.classList.remove('hidden');
        });
    </script>

</body>
</html>
