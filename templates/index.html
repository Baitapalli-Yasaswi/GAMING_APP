<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
        input {
            width: 80%;
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 1rem;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #5563c1; }
        #message {
            margin-top: 1rem;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Guess The Number</h1>
        <p>I'm thinking of a number between 1 and 100.</p>
        
        <input type="number" id="guessInput" min="1" max="100" placeholder="Enter your guess">
        <br>
        <button onclick="submitGuess()">Guess</button>

        <div id="message"></div>
    </div>

    <script>
        async function submitGuess() {
            const guessInput = document.getElementById("guessInput");
            const messageDiv = document.getElementById("message");
            const guess = guessInput.value;

            if (!guess) {
                messageDiv.style.color = "red";
                messageDiv.innerText = "Please enter a valid number!";
                return;
            }

            const response = await fetch("/guess", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ guess: guess })
            });

            const data = await response.json();
            messageDiv.innerText = data.message;

            if (data.result === "win") {
                messageDiv.style.color = "green";
                guessInput.value = "";
            } else {
                messageDiv.style.color = "#e67e22";
                guessInput.value = "";
                guessInput.focus();
            }
        }
    </script>

</body>
</html>
